        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(updateUserLocation, showError, { enableHighAccuracy: true });
            } else {
            alert("Geolocation is not supported by this browser.");
            }
        }


    

        function updateUserLocation(position) {
            const userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude
            };

            // Remove previous user marker
            if (userMarker) userMarker.setMap(null);

            // Add a new marker for the user
            userMarker = new google.maps.Marker({
                position: userLocation,
                map: map,
              //  center: userLocation,
                title: "You are here!",
                icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png" // Blue dot for user
            });

            // Check distance from target
            for(var i = 0; i < 3; i++) {
                const distance = getDistance(userLocation, targetLocation[i]);
                console.log("Distance to target: " + distance + " meters");

                if (distance <= 100 && !foundFigure[i]) {
                foundFigure[i] = true;
                addFigure(targetLocation[i]);
                } 
               
            }    
        }
        
      

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {

                // Get the user's location
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(updateUserLocation, showError, {

           // map.setCenter(userLocation);

        function addFigure(location) {
            let NewFigureMarker = new google.maps.Marker({
                position: location,
                map: map,
                title: "Hidden Figure!",
            });
            figures.push(NewFigureMarker); // Store the marker in the figures array

            LaterfigureLocation.push(location);

            SavedfigureLocation=location; // Save location for later
            document.getElementById("showFigureBtn").disabled = false;

            let iconIndex = LaterfigureLocation.length % icons.length;
            let selectedIcon = icons[iconIndex];

            // Store location and icon together as an object
            LaterfigureLocation.push({
                position: location,
                icon: selectedIcon
            });
        
            alert(`🎉 You Found a Hidden Figure!
            📍 Location: 
            Lat: ${SavedfigureLocation.lat.toFixed(5)}, 
            Lng: ${SavedfigureLocation.lng.toFixed(5)}
            `);
        }

        function showFigure() {
            // Remove existing markers first
            if (showFigureMarker) {
                showFigureMarker.forEach(marker => marker.setMap(null));
            }

            // Make sure it's an array
            if (!Array.isArray(showFigureMarker)) {
                showFigureMarker = [];
            }

            // Loop through all saved locations and show markers with their icons
            for(let i = 0; i < LaterfigureLocation.length; i++){
                let marker = new google.maps.Marker({
                    position: LaterfigureLocation[i].position, // Get each saved location
                    map: map,
                    icon: LaterfigureLocation[i].icon // Use corresponding icon
                });
                showFigureMarker.push(marker); // Store markers for potential removal later
            }
        }

        


        function getDistance(loc1, loc2) {
            const R = 6371000; // Earth radius in meters
            const dLat = (loc2.lat - loc1.lat) * (Math.PI / 180);
            const dLng = (loc2.lng - loc1.lng) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(loc1.lat * (Math.PI / 180)) * Math.cos(loc2.lat * (Math.PI / 180)) *
                      Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distance in meters
        }

        function showError(error) {
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    alert("User denied the request for Geolocation.");
                    break;
                case error.POSITION_UNAVAILABLE:
                    alert("Location information is unavailable.");
                    break;
                case error.TIMEOUT:
                    alert("The request to get user location timed out.");
                    break;
                case error.UNKNOWN_ERROR:
                    alert("An unknown error occurred.");
                    break;
            }
        }
